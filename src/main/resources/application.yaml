spring:
  application:
    name: accounts
  config:
#    import: "optional:configserver:http://localhost:8083"
        import: "optional:configserver:http://configserver:8083"

server:
  servlet:
    context-path: /account-service

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    shutdown:
      access: unrestricted
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: "accounts"
    description: "Eazy Bank Accounts Application"
    version: "1.0.0"